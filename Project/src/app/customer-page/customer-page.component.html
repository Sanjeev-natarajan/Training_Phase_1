<div class="hero-banner text-white mb-4 py-4">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
    <div class="text-center text-md-start mb-3 mb-md-0">
      <h2>Stay Happy and Healthy with <span class="text-warning">GroXarT</span></h2>
      <p>Shop fresh groceries with free delivery</p>
    </div>
    <div class="text-center">
      <img src="assets/images/corousel.jpg" alt="Groceries" class="img-fluid hero-img" />
    </div>
  </div>
</div>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Featured Products</h3>
    <div>
      <select class="form-select d-inline w-auto me-2" [(ngModel)]="selectedCategory">
        <option>All Categories</option>
        <option>Groceries</option>
        <option>Vegetables</option>
        <option>Snacks</option>
        <option>Dairy</option>
      </select>
      <select class="form-select d-inline w-auto" [(ngModel)]="selectedSort">
        <option>Sort by</option>
        <option>Price: Low to High</option>
        <option>Price: High to Low</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4" *ngFor="let product of filteredProducts">
      <div class="card h-100 shadow-sm border-0">
        <img [src]="product.imageUrl" class="card-img-top" alt="{{ product.name }}" style="height: 180px; object-fit: contain" />
        <div class="card-body">
          <h6 class="card-title">{{ product.name }}</h6>
          <p class="mb-1 fw-bold text-success">₹{{ product.price }}</p>
          <small class="text-muted">{{ product.category }} | Stock: {{ product.stock }}</small>
        </div>
        <div class="card-footer bg-white border-0 text-end">
          <button class="btn btn-sm btn-outline-success" (click)="addToCart(product)">
            <i class="bi bi-plus"></i> Add
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
