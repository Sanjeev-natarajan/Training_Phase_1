<div class="container mt-4">
  <h2>Add New Admin</h2>

  <form (ngSubmit)="onSubmit()" #adminForm="ngForm" class="mt-3">
    <div class="mb-3">
      <label style="margin-bottom: 6px;">Name</label>
      <input type="text" class="form-control" [(ngModel)]="adminData.name" name="name" required #name="ngModel" />
      <div *ngIf="name.invalid && name.touched" class="text-danger">
        Name is required.
      </div>
    </div>

    <div class="mb-3">
      <label style="margin-bottom: 6px;">Email</label>
      <input type="email" class="form-control" [(ngModel)]="adminData.email" name="email" required #email="ngModel" />
      <div *ngIf="email.invalid && email.touched" class="text-danger">
        Valid email is required.
      </div>
    </div>

    <div class="mb-3">
      <label style="margin-bottom: 6px;">Password</label>
      <input type="password" class="form-control" [(ngModel)]="adminData.password" name="password" required #password="ngModel" />
      <div *ngIf="password.invalid && password.touched" class="text-danger">
        Password is required.
      </div>
    </div>

    <div class="mb-3">
      <label style="margin-bottom: 6px;">Phone Number</label>
      <input type="text" class="form-control" [(ngModel)]="adminData.phoneNumber" name="phoneNumber" required #phone="ngModel" />
      <div *ngIf="phone.invalid && phone.touched" class="text-danger">
        Phone number is required.
      </div>
    </div>

    <div class="mb-3">
      <label style="margin-bottom: 6px;">Address</label>
      <input type="text" class="form-control" [(ngModel)]="adminData.address" name="address" required #address="ngModel" />
      <div *ngIf="address.invalid && address.touched" class="text-danger">
        Address is required.
      </div>
    </div>

    <div class="mb-3">
      <label style="margin-bottom: 6px;">City</label>
      <input type="text" class="form-control" [(ngModel)]="adminData.city" name="city" required #city="ngModel" />
      <div *ngIf="city.invalid && city.touched" class="text-danger">
        City is required.
      </div>
    </div>

    <button type="submit" style="margin-bottom: 10px;" class="btn btn-primary" [disabled]="adminForm.invalid">
      Add Admin
    </button>
  </form>

  <div *ngIf="successMessage" class="alert alert-success mt-3">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>
</div>
