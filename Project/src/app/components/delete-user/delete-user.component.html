<div class="container mt-4">
  <h2>Deactivate User</h2>

  <div class="mb-3">
    <label for="userId" class="form-label">User ID:</label>
    <input type="number" [(ngModel)]="userId" class="form-control w-25" placeholder="Enter User ID">
  </div>

  <button class="btn btn-danger" style="margin-bottom: 10px;" (click)="deleteUser()">Deactivate User</button>

  <p class="mt-3" *ngIf="message">{{ message }}</p>
</div>
