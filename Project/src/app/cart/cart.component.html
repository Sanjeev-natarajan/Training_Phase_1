<div class="container py-4">
  <h3 class="mb-3">My Cart</h3>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-success"></div>
  </div>

  <div *ngIf="!loading && cartItems.length === 0" class="alert alert-info">
    Your cart is empty.
  </div>

  <div *ngIf="!loading && cartItems.length > 0">
    <table class="table table-striped align-middle">
      <thead class="table-success">
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of cartItems">
          <td>{{ item.productName }}</td>
          <td>₹{{ item.price }}</td>
          <td>{{ item.quantity }}</td>
          <td>₹{{ item.total }}</td>
          <td>
            <button class="btn btn-danger btn-sm" (click)="removeItem(item)">
              Remove
            </button>
          </td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td colspan="4" class="text-end"><strong>Total:</strong></td>
          <td>
            <strong>₹{{ totalAmount }}</strong>
          </td>
        </tr>
      </tfoot>
    </table>

    <div *ngIf="cartItems.length > 0" class="text-end mt-3">
      <h5>Total: ₹{{ totalAmount }}</h5>
      <button class="btn btn-primary" (click)="makePayment()">
        Pay ₹{{ totalAmount }}
      </button>
    </div>
  </div>
</div>
