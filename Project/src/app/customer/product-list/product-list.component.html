<div class="hero-banner text-white mb-4 py-4">
  <div
    class="container d-flex flex-column flex-md-row justify-content-between align-items-center"
  >
    <div class="text-center text-md-start mb-3 mb-md-0">
      <h2>
        Login now to get Exciting <span class="text-warning">Discounts</span>
      </h2>
      <p>Shop fresh groceries with free delivery</p>
      <button class="btn btn-warning" routerLink="/login">Login Now</button>
    </div>
    <div class="text-center">
      <img
        src="assets/images/corousel.jpg"
        alt="Groceries"
        class="img-fluid hero-img"
      />
    </div>
  </div>
</div>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Featured Products</h3>
    <div>
      <select
        class="form-select d-inline w-auto me-2"
        [(ngModel)]="selectedCategory"
        (change)="onCategoryChange(selectedCategory)"
      >
        <option *ngFor="let cat of categories">{{ cat }}</option>
      </select>
      <select
        class="form-select d-inline w-auto"
        [(ngModel)]="selectedSort"
        (change)="onSortChange(selectedSort)"
      >
        <option *ngFor="let sort of sortOptions">{{ sort }}</option>
      </select>
    </div>
  </div>

  <div *ngIf="loading" class="text-center mb-3">
    <div class="spinner-border text-success"></div>
  </div>

  <div class="row">
    <div class="col-md-3 mb-4" *ngFor="let product of products">
      <div class="card h-100 shadow-sm border-0">
        <img
          [src]="product.imageUrl"
          class="card-img-top"
          alt="{{ product.name }}"
          style="height: 180px; object-fit: contain"
        />
        <div class="card-body">
          <h6 class="card-title">{{ product.name }}</h6>
          <p class="mb-1 fw-bold text-success">₹{{ product.price }}</p>
          <small class="text-muted"
            >{{ product.category }} | Stock: {{ product.stock }}</small
          >
        </div>
        <div class="card-footer bg-white border-0 text-end">
          <button class="btn btn-sm btn-outline-success" (click)="onAddClick()">
            <i class="bi bi-plus"></i> Add
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
