<div class="container my-5">
  <div class="d-flex flex-column flex-lg-row align-items-start">
    <div class="mb-3 mb-lg-0 me-lg-3">
      <button routerLink="/" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Back
      </button>
    </div>

    <div class="flex-grow-1 " style="max-width: 500px; margin-left: 240px;">
      <div class="card shadow-sm p-4">
        <form [formGroup]="registerForm" (ngSubmit)="submit()">
          <h3 class="mb-3 text-center">Register Customer</h3>

          <div class="mb-3">
            <label>Name</label>
            <input type="text" formControlName="name" class="form-control">
          </div>

          <div class="mb-3">
            <label>Email</label>
            <input type="email" formControlName="email" class="form-control">
          </div>

          <div class="mb-3">
            <label>Password</label>
            <input type="password" formControlName="password" class="form-control">
          </div>

          <div class="mb-3">
            <label>Phone Number</label>
            <input type="text" formControlName="phoneNumber" class="form-control">
          </div>

          <div class="mb-3">
            <label>Address</label>
            <input type="text" formControlName="address" class="form-control">
          </div>

          <div class="mb-3">
            <label>City</label>
            <input type="text" formControlName="city" class="form-control">
          </div>

          <div *ngIf="errorMessage" class="text-danger mb-2">{{ errorMessage }}</div>
          <div *ngIf="successMessage" class="text-success mb-2">{{ successMessage }}</div>

          <button type="submit" class="btn btn-success w-100 mt-3">Register</button>
        </form>
      </div>
    </div>
  </div>
</div>
